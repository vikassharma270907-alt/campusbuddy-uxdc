    // =========================================================================
    // ACTION CONTROLLER (A)
    // =========================================================================
    const A = {
      home() {
        S.tab = "today";
        S.err = "";
        S.modal = null;
        R();
      },
      theme() {
        S.theme = S.theme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", S.theme);
        save();
        R();
      },
      quick() {
        S = seed();
        S.mode = "demo";
        S.onboarded = true;
        S.tab = "study";
        S.t0 = Date.now();
        R();
        toast("90-second study sprint started! Pick a time and join your match.");
      },
      study() {
        S.tab = "study";
        S.t0 = Date.now();
        R();
      },
      sl(v) {
        S.sl = v;
        R();
      },
      start() {
        S.mode = "demo";
        S.tab = S.onboarded ? "today" : "onboard";
        R();
      },
      tab(v) {
        S.tab = v;
        S.err = "";
        S.modal = null;
        if (typeof window !== "undefined" && typeof window.scrollTo === "function") {
          window.scrollTo(0, 0);
        }
        R();
      },
      chip(v) {
        const [k, x] = v.split("|");
        const list = S.users[S.me][k];
        const idx = list.indexOf(x);
        if (idx < 0) list.push(x);
        else list.splice(idx, 1);
        R();
      },
      obdone(v) {
        const u = S.users[S.me];
        if (v !== "skip") {
          const raw = $("#ints") ? $("#ints").value : "";
          u.int = raw.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
        }
        S.onboarded = true;
        S.tab = "today";
        toast("Profile calibrated successfully.");
        R();
      },
      modal(v) {
        S.modal = v || null;
        if (!v) S.took = null;
        if (v && v !== "shortcuts") playChime('alert');
        R();
      },
      modal_close() {
        S.modal = null;
        S.took = null;
        R();
      },
      spot_filter(v) {
        S.spotFilter = v;
        R();
      },
      host_at_spot(spotName) {
        S.tab = "create";
        S.modal = null;
        R();
        setTimeout(() => {
          const locEl = $("#c-l");
          if (locEl && spotName) {
            locEl.value = spotName;
          }
        }, 10);
        toast(`Creating moment at ${spotName}`);
      },
      shuffle_starter() {
        S.starterOffset = (S.starterOffset || 0) + 1;
        R();
      },
      copy_details(id) {
        const a = S.acts.find(x => x.id === id);
        if (a) {
          const txt = `CampusBuddy Meetup: ${a.t} | ${a.d} (${a.s}) | Location: ${a.loc} (Public Campus Spot)`;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(txt)
              .then(() => toast("Meeting summary copied to clipboard!"))
              .catch(() => toast("Details: " + a.t + " at " + a.loc));
          } else {
            toast("Details: " + a.t + " at " + a.loc);
          }
        }
      },
      export_ics(id) {
        const a = S.acts.find(x => x.id === id);
        if (!a) return toast("Moment not found.");

        const starters = STARTERS[a.c] || STARTERS.study;
        const starterIdx = (a.id.charCodeAt(a.id.length - 1) + (S.starterOffset || 0)) % starters.length;
        const icebreaker = starters[starterIdx] || "";

        const eventDate = new Date();
        if (a.d === "Tomorrow") {
          eventDate.setDate(eventDate.getDate() + 1);
        }

        const hour = a.s === "Morning" ? 10 : a.s === "Afternoon" ? 14 : 18;
        eventDate.setHours(hour, 0, 0, 0);

        const endDate = new Date(eventDate.getTime() + (a.dur || 45) * 60000);

        const pad = n => String(n).padStart(2, "0");
        const formatIcsDate = d =>
          `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;

        const dtStart = formatIcsDate(eventDate);
        const dtEnd = formatIcsDate(endDate);
        const dtStamp = formatIcsDate(new Date());

        const sanitize = str => String(str || "").replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");

        const icsContent = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//CampusBuddy//UXDC 2026//EN",
          "CALSCALE:GREGORIAN",
          "METHOD:PUBLISH",
          "BEGIN:VEVENT",
          `UID:cb-${a.id}-${Date.now()}@campusbuddy.local`,
          `DTSTAMP:${dtStamp}`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          `SUMMARY:${sanitize("CampusBuddy: " + a.t)}`,
          `DESCRIPTION:${sanitize(a.desc + "\n\nVerified Spot: " + a.loc + "\nIcebreaker: " + icebreaker + "\n\nOrganized with CampusBuddy.")}`,
          `LOCATION:${sanitize(a.loc)}`,
          "STATUS:CONFIRMED",
          "END:VEVENT",
          "END:VCALENDAR"
        ].join("\r\n");

        try {
          const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `campusbuddy-${a.id}.ics`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          toast("Calendar invite (.ics) downloaded!");
        } catch (e) {
          toast("Calendar invite exported.");
        }
      },
      join(id) {
        const a = S.acts.find(x => x.id === id);
        const u = S.me;
        if (!a) return toast("Moment not found.");
        if (a.st !== "open") return toast("This moment is no longer open.");
        if (a.ps.includes(u)) return toast("You’re already in this moment.");
        if (a.ps.length >= a.max) return toast("This moment is full.");
        if (blocked(u, a.host)) return toast("Cannot join due to privacy settings.");

        a.ps.push(u);
        note(a.host, `${S.users[u].n} joined “${a.t}”.`);
        S.modal = id;
        S.took = S.t0 ? Math.max(1, Math.round((Date.now() - S.t0) / 1000)) : null;
        S.t0 = null;
        toast("You joined this moment!");
        celebrate();
        R();
      },
      invite(to) {
        const selectEl = $("#sel-" + to);
        const aid = selectEl ? selectEl.value : "";
        if (!aid) return toast("Create or join a moment first, then invite someone.");

        const a = S.acts.find(x => x.id === aid);
        if (!a) return toast("Moment not found.");
        if (a.ps.length >= a.max) return toast("That moment is already full.");
        if (a.ps.includes(to)) return toast(`${S.users[to].n} is already attending that moment.`);
        if (blocked(S.me, to)) return toast("You can’t invite this user.");

        const hasPending = S.inv.some(i => i.f === S.me && i.t === to && i.a === aid && i.s === "pending");
        if (hasPending) return toast("You already sent an invitation for this moment.");

        S.inv.push({ id: "i" + S.n++, f: S.me, t: to, a: aid, s: "pending" });
        note(to, `${S.users[S.me].n} invited you to “${a.t}”.`);
        toast("Invitation sent.");
        R();
      },
      resp(v) {
        const [id, to] = v.split("|");
        const i = S.inv.find(x => x.id === id);
        if (!i || i.s !== "pending") return toast("That invitation can’t change any more.");

        const a = S.acts.find(x => x.id === i.a);
        if (!a) return toast("Moment not found.");

        if (to === "accepted") {
          if (a.st !== "open") return toast("That moment is no longer open.");
          if (a.ps.length >= a.max) return toast("That moment reached capacity.");
          if (!a.ps.includes(i.t)) a.ps.push(i.t);
          note(i.f, `${S.users[i.t].n} accepted your invitation to “${a.t}”.`);
          S.modal = a.id;
          toast("Invitation accepted!");
          celebrate();
        } else if (to === "declined") {
          note(i.f, `${S.users[i.t].n} declined the invitation to “${a.t}”.`);
          toast("Invitation declined.");
        } else if (to === "cancelled") {
          toast("Invitation cancelled.");
        }

        i.s = to;
        R();
      },
      leave(id) {
        const a = S.acts.find(x => x.id === id);
        if (!a) return;
        if (a.host === S.me) {
          return toast("As host, use Cancel moment instead of leaving.");
        }
        a.ps = a.ps.filter(p => p !== S.me);
        note(a.host, `${S.users[S.me].n} left “${a.t}”.`);
        toast("You left this moment.");
        R();
      },
      cancel(id) {
        const a = S.acts.find(x => x.id === id);
        if (!a) return;
        if (a.host !== S.me) {
          return toast("Only the host can cancel this moment.");
        }
        a.st = "cancelled";
        S.inv.forEach(i => {
          if (i.a === id && i.s === "pending") i.s = "cancelled";
        });
        a.ps.forEach(p => {
          if (p !== S.me) note(p, `“${a.t}” was cancelled by the host.`);
        });
        toast("Moment cancelled.");
        R();
      },
      done(id) {
        const a = S.acts.find(x => x.id === id);
        if (!a) return;
        if (!a.ps.includes(S.me)) {
          return toast("Only participants can conclude this moment.");
        }
        a.st = "done";
        toast("Marked as concluded. Moved to Past.");
        R();
      },
      fbp(v) {
        if (!v || typeof v !== "string" || !v.includes("|")) return;
        const [a, o] = v.split("|");
        S.fp[a] = o;
        R();
      },
      fb(id) {
        if (S.fb.some(f => f.a === id && f.u === S.me)) {
          return toast("Feedback already submitted for this moment.");
        }
        const choice = S.fp[id];
        if (!choice) return toast("Select one rating option first.");
        const textInput = $("#fbt-" + id);
        const comment = textInput ? textInput.value.trim() : "";
        S.fb.push({ a: id, u: S.me, o: choice, x: comment });
        toast("Private feedback recorded. Thank you!");
        R();
      },
      clear_filters() {
        S.f = { c: "", d: "", s: "", o: "", sort: "fit" };
        toast("Filters reset.");
        R();
      },
      tpl(c) {
        const templates = {
          study: ["Calculus & Biology Focus Session", "One hour of quiet co-study. Bring problem sets or readings."],
          lunch: ["Casual Food Court Lunch Meetup", "Low-pressure lunch chat at the MacEwan Food Court. Everyone welcome."],
          coffee: ["Campus Coffee & Semester Catch-up", "Quick 30-minute coffee break to chat about electives and campus life."],
          walk: ["Fresh Air Walk Around Swann Mall", "Relaxing 40-minute campus walk. Great for clearing your head."]
        };
        const m = templates[c] || ["Study Together", "Casual study session."];
        S.draft = {
          ...(S.draft || {}),
          t: m[0],
          desc: m[1],
          c
        };
        if ($("#c-t")) $("#c-t").value = m[0];
        if ($("#c-ds")) $("#c-ds").value = m[1];
        if ($("#c-c")) $("#c-c").value = c;
      },
      create() {
        const titleEl = $("#c-t");
        const maxEl = $("#c-m");
        const durEl = $("#c-du");
        const catEl = $("#c-c");
        const descEl = $("#c-ds");
        const dayEl = $("#c-day");
        const slotEl = $("#c-s");
        const locEl = $("#c-l");
        const tagsEl = $("#c-tg");

        const t = titleEl ? titleEl.value.trim() : "";
        const m = parseInt(maxEl ? maxEl.value : 0, 10);
        const du = parseInt(durEl ? durEl.value : 0, 10);
        const cat = catEl ? catEl.value : "study";
        const desc = descEl ? descEl.value.trim() : "";
        const day = dayEl ? dayEl.value : "Today";
        const slot = slotEl ? slotEl.value : "Afternoon";
        const loc = locEl ? locEl.value : LOC[0];
        const tagsRaw = tagsEl ? tagsEl.value : "";
        const tags = tagsRaw.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);

        S.draft = { t, m, du, c: cat, desc, day, s: slot, loc, tags: tagsRaw };

        let err = "";
        if (t.length < 3) err = "Give your moment a title of at least 3 characters.";
        else if (!(m >= 2 && m <= 8)) err = "Attendee limit must be between 2 and 8.";
        else if (!(du >= 15 && du <= 180)) err = "Duration must be between 15 and 180 minutes.";

        if (err) {
          S.err = err;
          R();
          return;
        }

        S.acts.unshift({
          id: "a" + S.n++,
          t,
          c: cat,
          desc: desc || "Open meetup at a safe campus public spot.",
          d: day,
          s: slot,
          dur: du,
          loc: loc,
          max: m,
          host: S.me,
          ps: [S.me],
          tags: tags,
          sty: (S.users[S.me].sty && S.users[S.me].sty[0]) || "Casual conversation",
          st: "open"
        });

        S.err = "";
        S.draft = null;
        playChime('success');
        toast("Moment posted to campus!");
        S.tab = "discover";
        R();
      },
      clear_notes() {
        S.notes = S.notes.filter(n => n.to !== S.me);
        toast("Notifications cleared.");
        R();
      },
      vis() {
        const u = S.users[S.me];
        u.vis = !u.vis;
        toast(u.vis ? "Profile is now visible." : "Profile is now hidden.");
        R();
      },
      block() {
        const target = $("#bl") ? $("#bl").value : "";
        if (!target || !S.users[target] || target === S.me) return;
        if (!blocked(S.me, target)) {
          S.blocks.push([S.me, target]);
        }
        // Auto-cancel mutual pending invitations
        S.inv.forEach(i => {
          if (i.s === "pending" && (
            (i.f === S.me && i.t === target) ||
            (i.f === target && i.t === S.me)
          )) {
            i.s = "cancelled";
          }
        });
        toast(`Blocked ${S.users[target].n}.`);
        R();
      },
      unblock(target) {
        S.blocks = S.blocks.filter(b => !(b[0] === S.me && b[1] === target));
        toast(`Unblocked ${S.users[target].n}.`);
        R();
      },
      report() {
        const who = $("#rp-w") ? $("#rp-w").value : "";
        const why = $("#rp-y") ? $("#rp-y").value : "";
        const text = $("#rp-t") ? $("#rp-t").value.trim() : "";
        if (!who) return toast("Select a student to report.");
        S.reports.push({
          by: S.me,
          who: who,
          why: why,
          x: text,
          st: "Logged for review",
          time: new Date().toISOString()
        });
        toast("Report logged for campus review. Thank you for keeping our community safe.");
        R();
      },
      reset() {
        S = seed();
        S.mode = "demo";
        S.onboarded = true;
        save();
        toast("Prototype reset to seed data.");
        R();
      }
    };

    // Global Event Delegation
    document.addEventListener("click", e => {
      if (e.target.classList.contains("ov")) {
        A.modal_close();
        return;
      }
      const b = e.target.closest("[data-a]");
      if (b && A[b.dataset.a]) {
        A[b.dataset.a](b.dataset.v);
      }
    });

    document.addEventListener("change", e => {
      if (e.target.id === "who") {
        S.me = e.target.value;
        S.tab = "today";
        S.modal = null;
        S.took = null;
        S.err = "";
        toast(`Switched persona to ${S.users[S.me].n}`);
        R();
      } else if (e.target.dataset.f) {
        S.f[e.target.dataset.f] = e.target.value;
        R();
      }
    });

    // BroadcastChannel sync listener
    if (syncChannel) {
      syncChannel.onmessage = event => {
        if (event.data && event.data.type === "SYNC" && event.data.state) {
          if (event.data.state.acts) S.acts = event.data.state.acts;
          if (event.data.state.inv) S.inv = event.data.state.inv;
          if (event.data.state.notes) S.notes = event.data.state.notes;
          if (event.data.state.blocks) S.blocks = event.data.state.blocks;
          R();
        }
      };
    }

    // Storage fallback for cross-tab sync & keyboard hotkeys
    if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
      window.addEventListener("storage", e => {
        if (e.key === "cb_state_v2" && e.newValue) {
          try {
            const ext = JSON.parse(e.newValue);
            if (ext && ext.acts) {
              S.acts = ext.acts;
              if (ext.inv) S.inv = ext.inv;
              if (ext.notes) S.notes = ext.notes;
              if (ext.blocks) S.blocks = ext.blocks;
              R();
            }
          } catch (err) {}
        }
      });

      // Keyboard Accessibility (Esc, ?, S, T, 1-8)
      window.addEventListener("keydown", e => {
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

        if (e.key === "Escape") {
          if (S.modal) {
            A.modal_close();
          }
          return;
        }
        if (e.key === "?" || (e.shiftKey && e.key === "/")) {
          A.modal("shortcuts");
          return;
        }
        if (e.key.toLowerCase() === "s" && !e.ctrlKey && !e.metaKey) {
          A.modal("spots");
          return;
        }
        if (e.key.toLowerCase() === "t" && !e.ctrlKey && !e.metaKey) {
          A.theme();
          return;
        }
        const tabKeys = { "1": "today", "2": "discover", "3": "people", "4": "create", "5": "invites", "6": "plans", "7": "alerts", "8": "safety" };
        if (tabKeys[e.key]) {
          A.tab(tabKeys[e.key]);
        }
      });
    }

    // Initial render
    R();

    // 1-Second Precision Timer for 90-Second Micro-Connection Sprint
    setInterval(() => {
      const clk = $("#clk");
      if (clk && S.t0) {
        clk.textContent = Math.floor((Date.now() - S.t0) / 1000);
      }
    }, 1000);

    // Register Service Worker for offline resilience
    if (typeof window !== "undefined" && typeof navigator !== "undefined" && "serviceWorker" in navigator && window.location && window.location.protocol && window.location.protocol.startsWith("http") && typeof window.addEventListener === "function") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
