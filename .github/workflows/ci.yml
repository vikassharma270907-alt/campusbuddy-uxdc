name: CampusBuddy CI & Quality Gate

on:
  push:
    branches: [ main, master, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-campusbuddy:
    name: Test & Validate (${{ matrix.os }} · Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['20.x', '22.x', '24.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Project Deliverables Exist
        run: |
          test -f campusbuddy.html || (echo "Missing campusbuddy.html" && exit 1)
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f video_showcase.html || (echo "Missing video_showcase.html" && exit 1)
          test -f video.html || (echo "Missing video.html" && exit 1)
          test -f campusbuddy_showcase.mp4 || (echo "Missing campusbuddy_showcase.mp4" && exit 1)
          test -f server.js || (echo "Missing server.js" && exit 1)
          test -f manifest.webmanifest || (echo "Missing manifest.webmanifest" && exit 1)
          test -f sw.js || (echo "Missing sw.js" && exit 1)
          test -f render.yaml || (echo "Missing render.yaml" && exit 1)
          test -f DESIGN.md || (echo "Missing DESIGN.md" && exit 1)
          test -f RESEARCH.md || (echo "Missing RESEARCH.md" && exit 1)
          test -f DEMO_SCRIPT.md || (echo "Missing DEMO_SCRIPT.md" && exit 1)
          test -f SUBMISSION.md || (echo "Missing SUBMISSION.md" && exit 1)
          test -f AUDIT_REPORT.md || (echo "Missing AUDIT_REPORT.md" && exit 1)
          test -f package.json || (echo "Missing package.json" && exit 1)

      - name: Run Full CI Quality Gate (Lint, Typecheck, Test Suite, Sync & Dist Build)
        run: npm run ci

      - name: Verify Production Dist Assets
        run: |
          test -d dist || (echo "Missing dist directory" && exit 1)
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          test -f dist/campusbuddy.html || (echo "Missing dist/campusbuddy.html" && exit 1)
          test -f dist/video_showcase.html || (echo "Missing dist/video_showcase.html" && exit 1)
          test -f dist/video.html || (echo "Missing dist/video.html" && exit 1)
          test -f dist/campusbuddy_showcase.mp4 || (echo "Missing dist/campusbuddy_showcase.mp4" && exit 1)
          test -f dist/manifest.webmanifest || (echo "Missing dist/manifest.webmanifest" && exit 1)
          test -f dist/sw.js || (echo "Missing dist/sw.js" && exit 1)
